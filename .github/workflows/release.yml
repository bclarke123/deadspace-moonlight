name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: cmd
        run: build.bat

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/d3d9.dll
          generate_release_notes: true
          fail_on_unmatched_files: true
